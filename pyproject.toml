[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "by-tiny-agents"
version = "0.2.5"
description = "Small building blocks for Python agents and harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["openai", "tiktoken", "ddgs"]

[project.optional-dependencies]
panel = ["prompt-toolkit", "python-dotenv"]

[project.urls]
Homepage = "https://github.com/kauanmezavila/tiny-agents"
Repository = "https://github.com/kauanmezavila/tiny-agents"
Issues = "https://github.com/kauanmezavila/tiny-agents/issues"

[dependency-groups]
dev = ["black"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tinyAgents", "tinyAgents.*", "src", "src.*", "Packages", "Packages.*", "Tools", "Tools.*"]
namespaces = true

[tool.setuptools.package-data]
Tools = ["*.json"]
