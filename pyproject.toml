[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-agents"
version = "0.1.2"
description = "Small building blocks for Python agents and harnesses"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["openai"]

[dependency-groups]
dev = ["black"]

[tool.setuptools]
packages = ["src", "Packages"]
